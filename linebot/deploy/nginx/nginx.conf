# nginx.conf สำหรับ Windows
# วางไฟล์นี้ใน C:\nginx\conf\nginx.conf
# ดาวน์โหลด nginx สำหรับ Windows: https://nginx.org/en/download.html

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # Log
    access_log  logs/access.log;
    error_log   logs/error.log;

    # Bot server upstream
    upstream mochi_bot {
        server 127.0.0.1:5001;
    }

    # HTTP → HTTPS redirect (ใช้เมื่อมี SSL)
    # server {
    #     listen 80;
    #     server_name your-domain.com;
    #     return 301 https://$host$request_uri;
    # }

    # HTTP (ถ้าใช้ Cloudflare Tunnel ไม่ต้องทำ SSL เอง)
    server {
        listen 80;
        server_name localhost;

        location /webhook {
            proxy_pass         http://mochi_bot/webhook;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Line-Signature $http_x_line_signature;
            proxy_read_timeout 30s;
            client_max_body_size 50M;
        }

        location /health {
            proxy_pass http://mochi_bot/health;
        }
    }

    # HTTPS (ถ้าใช้ SSL certificate จาก Let's Encrypt)
    # server {
    #     listen 443 ssl;
    #     server_name your-domain.com;
    #
    #     ssl_certificate     C:/certbot/live/your-domain.com/fullchain.pem;
    #     ssl_certificate_key C:/certbot/live/your-domain.com/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #
    #     location /webhook {
    #         proxy_pass       http://mochi_bot/webhook;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Line-Signature $http_x_line_signature;
    #         client_max_body_size 50M;
    #     }
    # }
}
