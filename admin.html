<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>กล่องข้อความติดต่อ | แอดมิน BuncheePro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--brand:#16a34a;--brand-dark:#15803d;--brand-light:#dcfce7;--ink:#0f172a;--text:#1e293b;--muted:#64748b;--bg:#f1f5f9;--card:#fff;--border:#e2e8f0;--amber:#d97706;--red:#dc2626;--shadow:0 1px 3px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.05)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Sarabun",-apple-system,"Segoe UI","Noto Sans Thai",Tahoma,sans-serif;background:var(--bg);color:var(--text);line-height:1.55}
  .wrap{max-width:960px;margin:0 auto;padding:0 18px}
  header{background:var(--ink);color:#fff;padding:16px 0}
  header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px}
  .logo .baht{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:var(--brand);font-size:18px}
  header .sub{font-size:13px;color:#94a3b8}
  header a.back{color:#cbd5e1;font-size:13px;text-decoration:none}
  header a.back:hover{color:#fff}

  /* Gate */
  .gate{max-width:400px;margin:70px auto;background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:32px 28px;text-align:center}
  .gate .baht2{width:52px;height:52px;border-radius:13px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:26px;margin:0 auto 14px}
  .gate h1{font-size:20px;color:var(--ink);margin-bottom:6px}
  .gate p{color:var(--muted);font-size:14px;margin-bottom:20px}
  .gate input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-family:inherit;font-size:15px;text-align:center}
  .gate input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(22,163,74,.14)}
  .gate .err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}

  .btn{border:none;cursor:pointer;font-family:inherit;background:var(--brand);color:#fff;font-weight:700;font-size:15px;padding:12px 18px;border-radius:10px;transition:background .15s}
  .btn:hover{background:var(--brand-dark)}
  .btn.block{width:100%;margin-top:16px}
  .btn.ghost{background:none;color:var(--text);border:1px solid var(--border);font-weight:600;font-size:13px;padding:7px 12px}
  .btn.ghost:hover{border-color:var(--brand);color:var(--brand)}

  main{padding:26px 0 60px;display:none}
  main.show{display:block}

  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .stats{display:flex;gap:10px;flex-wrap:wrap}
  .chip{background:var(--card);border:1px solid var(--border);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer;color:var(--muted);transition:.15s;font-weight:600}
  .chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip b{color:var(--brand)}
  .chip.active b{color:#86efac}
  .spacer{flex:1}
  .meta{font-size:12.5px;color:var(--muted)}

  .list{display:flex;flex-direction:column;gap:12px}
  .msg{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:18px 20px}
  .msg.new{border-left:4px solid var(--brand)}
  .msg.read{border-left:4px solid var(--amber)}
  .msg.done{border-left:4px solid #94a3b8;opacity:.82}
  .msg .top{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .msg .name{font-weight:700;color:var(--ink);font-size:16px}
  .msg .badge{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px}
  .badge.new{background:var(--brand-light);color:var(--brand-dark)}
  .badge.read{background:#fef3c7;color:#b45309}
  .badge.done{background:#e2e8f0;color:#475569}
  .msg .time{margin-left:auto;font-size:12.5px;color:var(--muted)}
  .msg .topic{display:inline-block;margin-top:8px;font-size:12.5px;background:var(--bg);color:var(--muted);padding:3px 10px;border-radius:6px}
  .msg .body{margin-top:10px;white-space:pre-wrap;font-size:14.5px;color:var(--text);border-left:3px solid var(--border);padding-left:12px}
  .msg .contacts{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:13.5px}
  .msg .contacts a{color:var(--brand-dark);text-decoration:none;font-weight:600}
  .msg .contacts a:hover{text-decoration:underline}
  .msg .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
  .btn.sm{font-size:12.5px;padding:6px 12px;border-radius:8px}
  .btn.danger{background:none;color:var(--red);border:1px solid #fecaca}
  .btn.danger:hover{background:#fef2f2}

  .empty{text-align:center;color:var(--muted);padding:60px 20px}
  .empty .em{font-size:40px;margin-bottom:10px}
  .banner{background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:16px}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div>
      <div class="logo"><span class="baht">฿</span> แอดมิน BuncheePro</div>
      <div class="sub">กล่องข้อความติดต่อจากเว็บไซต์</div>
    </div>
    <a class="back" href="/contact.html">← กลับหน้าติดต่อ</a>
  </div>
</header>

<!-- Login gate -->
<section class="gate" id="gate">
  <div class="baht2">🔐</div>
  <h1>เข้าสู่ระบบแอดมิน</h1>
  <p>ใส่กุญแจแอดมินเพื่อดูข้อความที่ลูกค้าส่งเข้ามา</p>
  <input type="password" id="keyInput" placeholder="กุญแจแอดมิน (ADMIN_KEY)" autocomplete="current-password">
  <button class="btn block" id="loginBtn">เข้าสู่ระบบ</button>
  <div class="err" id="gateErr"></div>
</section>

<!-- Dashboard -->
<main id="app">
  <div class="banner" id="storeBanner" style="display:none"></div>
  <div class="toolbar">
    <div class="stats" id="stats"></div>
    <div class="spacer"></div>
    <button class="btn ghost" id="refreshBtn">🔄 รีเฟรช</button>
    <button class="btn ghost" id="logoutBtn">ออกจากระบบ</button>
  </div>
  <div class="meta" id="meta" style="margin-bottom:14px"></div>
  <div class="list" id="list"></div>
</main>

<script>
  var KEY_STORAGE = 'bunchee_admin_key';
  var API = '/api/messages';
  var state = { items: [], filter: 'all', key: '' };

  var gate = document.getElementById('gate');
  var app = document.getElementById('app');
  var keyInput = document.getElementById('keyInput');
  var gateErr = document.getElementById('gateErr');

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]});}

  function fmtTime(iso){
    try{
      var d = new Date(iso);
      return d.toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'});
    }catch(e){return iso;}
  }

  function api(method, params, body){
    var url = API + '?key=' + encodeURIComponent(state.key) + (params||'');
    return fetch(url, {
      method: method,
      headers: { 'Content-Type':'application/json', 'x-admin-key': state.key },
      body: body ? JSON.stringify(body) : undefined
    }).then(function(r){ return r.json().then(function(j){ return {status:r.status, body:j}; }); });
  }

  function login(key){
    state.key = key;
    return api('GET','').then(function(res){
      if(res.status === 401){ throw new Error('กุญแจแอดมินไม่ถูกต้อง'); }
      if(!res.body.ok){ throw new Error(res.body.error || 'เข้าสู่ระบบไม่สำเร็จ'); }
      localStorage.setItem(KEY_STORAGE, key);
      gate.style.display='none';
      app.classList.add('show');
      render(res.body);
      return res.body;
    });
  }

  function load(){
    api('GET','').then(function(res){
      if(res.body && res.body.ok) render(res.body);
    });
  }

  function render(data){
    state.items = data.items || [];
    var banner = document.getElementById('storeBanner');
    if(data.storage === 'file'){
      banner.style.display='block';
      banner.innerHTML = '⚠️ กำลังใช้ที่เก็บแบบไฟล์ (ชั่วคราวบน Vercel) — แนะนำตั้งค่า Vercel KV เพื่อเก็บข้อความถาวร ดูวิธีใน SETUP.md';
    } else { banner.style.display='none'; }

    var s = data.summary || {new:0,read:0,done:0};
    var total = data.count || 0;
    var filters = [
      {k:'all', label:'ทั้งหมด', n: total},
      {k:'new', label:'ใหม่', n: s.new||0},
      {k:'read', label:'อ่านแล้ว', n: s.read||0},
      {k:'done', label:'เสร็จสิ้น', n: s.done||0}
    ];
    document.getElementById('stats').innerHTML = filters.map(function(f){
      return '<span class="chip '+(state.filter===f.k?'active':'')+'" data-f="'+f.k+'">'+f.label+' <b>'+f.n+'</b></span>';
    }).join('');
    document.querySelectorAll('.chip').forEach(function(c){
      c.onclick=function(){ state.filter=c.getAttribute('data-f'); renderList(); updateChips(); };
    });
    document.getElementById('meta').textContent = 'ทั้งหมด '+total+' ข้อความ · ที่เก็บ: '+(data.storage==='kv'?'Vercel KV (ถาวร)':'ไฟล์ (ชั่วคราว)');
    renderList();
  }

  function updateChips(){
    document.querySelectorAll('.chip').forEach(function(c){
      c.classList.toggle('active', c.getAttribute('data-f')===state.filter);
    });
  }

  function renderList(){
    var items = state.items.filter(function(m){ return state.filter==='all' || m.status===state.filter; });
    var list = document.getElementById('list');
    if(!items.length){
      list.innerHTML = '<div class="empty"><div class="em">📭</div>ยังไม่มีข้อความในหมวดนี้</div>';
      return;
    }
    list.innerHTML = items.map(function(m){
      var statusText = {new:'ใหม่',read:'อ่านแล้ว',done:'เสร็จสิ้น'}[m.status]||m.status;
      var contacts = [];
      contacts.push('<a href="tel:'+esc((m.phone||'').replace(/\D/g,''))+'">📞 '+esc(m.phone)+'</a>');
      if(m.email) contacts.push('<a href="mailto:'+esc(m.email)+'">✉️ '+esc(m.email)+'</a>');
      contacts.push('<a href="https://line.me/R/ti/p/@buncheepro" target="_blank" rel="noopener">🟢 ตอบทาง LINE</a>');
      var actions = [];
      if(m.status!=='read') actions.push('<button class="btn sm ghost" data-act="read" data-id="'+m.id+'">ทำเครื่องหมายอ่านแล้ว</button>');
      if(m.status!=='done') actions.push('<button class="btn sm" data-act="done" data-id="'+m.id+'">✓ เสร็จสิ้น</button>');
      if(m.status!=='new') actions.push('<button class="btn sm ghost" data-act="new" data-id="'+m.id+'">กลับเป็นใหม่</button>');
      actions.push('<button class="btn sm danger" data-act="delete" data-id="'+m.id+'">ลบ</button>');
      return '<div class="msg '+m.status+'">'
        + '<div class="top"><span class="name">'+esc(m.name)+'</span>'
        + '<span class="badge '+m.status+'">'+statusText+'</span>'
        + '<span class="time">'+fmtTime(m.createdAt)+'</span></div>'
        + '<div><span class="topic">'+esc(m.topic)+'</span></div>'
        + '<div class="body">'+esc(m.message)+'</div>'
        + '<div class="contacts">'+contacts.join('')+'</div>'
        + '<div class="actions">'+actions.join('')+'</div>'
        + '</div>';
    }).join('');

    list.querySelectorAll('[data-act]').forEach(function(b){
      b.onclick=function(){
        var id=b.getAttribute('data-id'), act=b.getAttribute('data-act');
        if(act==='delete'){
          if(!confirm('ลบข้อความนี้ถาวร?')) return;
          api('DELETE','&id='+encodeURIComponent(id)).then(load);
        } else {
          api('PATCH','&id='+encodeURIComponent(id), {status:act}).then(load);
        }
      };
    });
  }

  document.getElementById('loginBtn').onclick=function(){
    gateErr.textContent='';
    var k = keyInput.value.trim();
    if(!k){ gateErr.textContent='กรุณาใส่กุญแจแอดมิน'; return; }
    login(k).catch(function(e){ gateErr.textContent = e.message; });
  };
  keyInput.addEventListener('keydown',function(e){ if(e.key==='Enter') document.getElementById('loginBtn').click(); });
  document.getElementById('refreshBtn').onclick=load;
  document.getElementById('logoutBtn').onclick=function(){
    localStorage.removeItem(KEY_STORAGE);
    state.key=''; app.classList.remove('show'); gate.style.display='block'; keyInput.value='';
  };

  // auto-login ถ้าเคยใส่กุญแจไว้
  var saved = localStorage.getItem(KEY_STORAGE);
  if(saved){ login(saved).catch(function(){ localStorage.removeItem(KEY_STORAGE); }); }
</script>
</body>
</html>
