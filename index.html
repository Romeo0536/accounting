<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sirikul Accounting &amp; Tax — Client Portal &amp; Admin Dashboard</title>
<style>
  :root{
    --violet:#6d28d9; --violet2:#7c3aed; --violet-dark:#5b21b6; --indigo:#4f46e5;
    --bg:#f2f1f9; --card:#ffffff; --ink:#1e1b3a; --muted:#6b7280; --line:#e9e7f2;
    --green:#16a34a; --green-bg:#dcfce7; --amber:#d97706; --amber-bg:#fef3c7;
    --red:#dc2626; --red-bg:#fee2e2; --blue:#2563eb; --blue-bg:#dbeafe;
    --purple-bg:#ede9fe; --sky-bg:#e0f2fe;
    --side:#171533; --side2:#201d45; --side-muted:#9c98c4; --side-head:#6f6ba0;
    --shadow:0 1px 3px rgba(24,20,60,.06), 0 8px 24px rgba(24,20,60,.05);
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Sarabun","Noto Sans Thai",-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;font-size:14px}
  .hidden{display:none!important}
  a{color:inherit;text-decoration:none}

  /* ---------- LOGIN ---------- */
  .login-screen{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;
    background:radial-gradient(1200px 600px at 50% -10%, #2a2358 0%, #14122e 55%, #0c0a20 100%)}
  .login-card{background:#fff;border-radius:18px;width:100%;max-width:430px;padding:34px 32px 26px;box-shadow:0 30px 70px rgba(0,0,0,.45)}
  .brand-logo{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:8px}
  .brand-logo .mark{width:118px;height:70px;display:flex;align-items:center;justify-content:center}
  .brand-logo .name{font-weight:800;letter-spacing:2px;font-size:19px;color:#1e1b3a}
  .brand-logo .name .dot{color:var(--violet)}
  .brand-logo .sub{font-size:9px;letter-spacing:4px;color:var(--muted);font-weight:700}
  .login-hr{height:1px;background:var(--line);margin:16px 0 18px}
  .login-title{text-align:center;font-size:15px;font-weight:700;margin-bottom:20px;color:#2a2550}
  .login-title span{color:var(--violet)}
  .fld{margin-bottom:14px}
  .fld label{display:block;font-size:12.5px;font-weight:600;color:#4b4870;margin-bottom:6px}
  .fld input,.fld select,.fld textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:14px;background:#faf9fe}
  .fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid #ddd6fe;border-color:var(--violet)}
  .login-remember{display:flex;align-items:center;gap:8px;font-size:13px;color:#4b4870;margin:4px 0 18px}
  .btn-login{width:100%;padding:12px;border:none;border-radius:10px;font-family:inherit;font-weight:700;font-size:14px;color:#fff;cursor:pointer;
    background:linear-gradient(135deg,#3a2f6e,#2a2358)}
  .btn-login:hover{filter:brightness(1.12)}
  .login-links{display:flex;justify-content:space-between;margin-top:16px;font-size:12.5px;color:var(--violet);font-weight:600}
  .login-links a{cursor:pointer}
  .login-foot{text-align:center;margin-top:20px;font-size:11px;color:#9a97b8}
  .login-err{color:var(--red);font-size:13px;text-align:center;min-height:18px;margin-top:8px}
  .login-demo{margin-top:14px;background:#f6f4fd;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:11.5px;color:#6b6790;line-height:1.7}

  /* ---------- APP SHELL ---------- */
  .app{display:flex;min-height:100vh}
  .sidebar{width:248px;flex-shrink:0;background:var(--side);color:var(--side-muted);display:flex;flex-direction:column;
    max-height:100vh;position:sticky;top:0;overflow-y:auto}
  .sidebar::-webkit-scrollbar{width:6px}.sidebar::-webkit-scrollbar-thumb{background:#33305e;border-radius:3px}
  .side-brand{padding:18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #262248}
  .side-brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#7c3aed,#4f46e5);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
  .side-brand .t{font-size:13.5px;font-weight:800;color:#fff;line-height:1.25}
  .side-brand .t small{display:block;font-size:10px;font-weight:600;color:var(--side-muted)}
  .nav{padding:8px 0;flex:1}
  .nav .sec{font-size:10.5px;letter-spacing:1px;color:var(--side-head);font-weight:700;padding:14px 20px 6px;text-transform:uppercase}
  .nav a{display:flex;align-items:center;gap:11px;padding:9px 20px;cursor:pointer;font-size:13.5px;border-left:3px solid transparent;color:var(--side-muted)}
  .nav a .ic{width:18px;text-align:center;font-size:15px}
  .nav a:hover{background:#211e42;color:#fff}
  .nav a.active{background:linear-gradient(90deg,rgba(124,58,237,.28),transparent);color:#fff;border-left-color:var(--violet2)}
  .nav a .bdg{margin-left:auto;background:#3a2f6e;color:#cbb8ff;font-size:10px;padding:1px 7px;border-radius:999px;font-weight:700}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{background:#fff;border-bottom:1px solid var(--line);padding:11px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
  .topbar .left{display:flex;align-items:center;gap:12px}
  .topbar .burger{font-size:18px;cursor:pointer;color:var(--muted);display:none}
  .topbar h1{font-size:16px;font-weight:700}
  .topbar .right{display:flex;align-items:center;gap:16px}
  .who{text-align:right;font-size:12px;line-height:1.3}
  .who b{font-size:13px}.who small{color:var(--muted)}
  .bell{position:relative;font-size:18px;cursor:pointer}
  .bell .cnt{position:absolute;top:-6px;right:-7px;background:var(--red);color:#fff;font-size:9px;font-weight:700;border-radius:999px;padding:1px 5px}
  .content{padding:22px 24px 40px;flex:1}

  /* ---------- HERO ---------- */
  .hero{border-radius:var(--radius);padding:22px 26px;color:#fff;margin-bottom:20px;position:relative;overflow:hidden;
    background:linear-gradient(115deg,#5b21b6 0%,#6d28d9 45%,#7c3aed 100%);box-shadow:0 10px 30px rgba(91,33,182,.28)}
  .hero .tag{display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);font-size:10.5px;font-weight:700;letter-spacing:1px;padding:3px 11px;border-radius:999px;margin-bottom:10px}
  .hero h2{font-size:22px;font-weight:800;line-height:1.25}
  .hero h2 span{color:#ffe27a}
  .hero p{font-size:13px;opacity:.9;margin-top:6px}
  .hero .clock{position:absolute;top:22px;right:26px;text-align:right}
  .hero .clock b{font-size:20px;font-weight:800}
  .hero .clock small{display:block;opacity:.85;font-size:11px}
  .hero-actions{position:absolute;top:20px;right:26px;display:flex;gap:8px}

  /* ---------- STAT TILES ---------- */
  .stats{display:grid;gap:14px;margin-bottom:20px;grid-template-columns:repeat(auto-fit,minmax(178px,1fr))}
  .tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;position:relative;box-shadow:var(--shadow)}
  .tile .ico{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px}
  .tile .lab{font-size:12.5px;color:var(--muted);font-weight:600}
  .tile .num{font-size:26px;font-weight:800;margin-top:6px}
  .tile .hint{font-size:11px;color:var(--muted);margin-top:3px}
  .i-violet{background:var(--purple-bg);color:var(--violet)}
  .i-green{background:var(--green-bg);color:var(--green)}
  .i-amber{background:var(--amber-bg);color:var(--amber)}
  .i-red{background:var(--red-bg);color:var(--red)}
  .i-blue{background:var(--blue-bg);color:var(--blue)}
  .i-sky{background:var(--sky-bg);color:#0284c7}
  .n-violet{color:var(--violet)}.n-green{color:var(--green)}.n-amber{color:var(--amber)}.n-red{color:var(--red)}.n-blue{color:var(--blue)}

  /* ---------- CARDS ---------- */
  .grid{display:grid;gap:18px}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px}
  .card-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .card-h h3{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px}
  .card-h .sub{font-size:11.5px;color:var(--muted);font-weight:500}
  .card-b{padding:16px 18px}
  .card-b.flush{padding:0}

  /* ---------- TABLE ---------- */
  .tbl-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
  th{color:var(--muted);font-weight:600;background:#faf9fe;font-size:12px;white-space:nowrap}
  tbody tr:hover{background:#faf9fe}
  td .mono{font-family:ui-monospace,monospace;font-size:12px;color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:34px}

  /* ---------- BADGES ---------- */
  .b{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
  .b.green{background:var(--green-bg);color:#15803d}
  .b.amber{background:var(--amber-bg);color:#b45309}
  .b.red{background:var(--red-bg);color:#b91c1c}
  .b.blue{background:var(--blue-bg);color:#1d4ed8}
  .b.violet{background:var(--purple-bg);color:var(--violet)}
  .b.gray{background:#eceaf4;color:#555}
  .b.orange{background:#ffedd5;color:#c2410c}
  .b.teal{background:#ccfbf1;color:#0f766e}

  /* ---------- BUTTONS ---------- */
  button,.btn{font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;border:none;border-radius:9px;padding:8px 14px}
  .btn-p{background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff}
  .btn-p:hover{filter:brightness(1.08)}
  .btn-g{background:#f1eefb;color:var(--violet)}
  .btn-g:hover{background:#e6dffa}
  .btn-o{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .btn-o:hover{background:#f7f6fc}
  .btn-danger{background:var(--red-bg);color:var(--red)}
  .btn-green{background:var(--green);color:#fff}
  .btn-sm{padding:5px 10px;font-size:12px}
  .btn-ico{width:32px;height:30px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;background:#f1eefb;color:var(--violet);margin-right:3px}
  .btn-ico.warn{background:#fff7ed;color:#c2410c}
  .btn-ico.plain{background:#f5f4fa;color:var(--muted)}
  .btn-ico:hover{filter:brightness(.96)}

  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .search{padding:8px 12px;border:1px solid var(--line);border-radius:9px;font-size:13px;font-family:inherit;min-width:200px;background:#faf9fe}
  .sel{padding:8px 12px;border:1px solid var(--line);border-radius:9px;font-size:13px;font-family:inherit;background:#faf9fe}
  .chip{padding:5px 12px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--muted)}
  .chip.on{background:var(--violet);color:#fff;border-color:var(--violet)}
  .chip .c{opacity:.7;margin-left:3px}

  .two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .three{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .kv{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px}
  .kv .k{color:var(--muted);min-width:120px;display:flex;align-items:center;gap:7px}
  .kv .v{font-weight:600}
  .kv:last-child{border-bottom:none}

  .prog{height:8px;border-radius:999px;background:#eee;overflow:hidden}
  .prog>span{display:block;height:100%;border-radius:999px}

  .steps{display:flex;align-items:center;gap:0;margin:6px 0 4px}
  .steps .st{flex:1;display:flex;flex-direction:column;align-items:center;position:relative}
  .steps .st .dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:#eee;color:#999;z-index:2}
  .steps .st.done .dot{background:var(--green);color:#fff}
  .steps .st.cur .dot{background:var(--violet);color:#fff;box-shadow:0 0 0 4px #ede9fe}
  .steps .st .lb{font-size:10.5px;margin-top:5px;color:var(--muted)}
  .steps .st:not(:last-child):after{content:"";position:absolute;top:15px;left:50%;width:100%;height:3px;background:#eee;z-index:1}
  .steps .st.done:not(:last-child):after{background:var(--green)}

  .cal{width:100%;border-collapse:collapse;table-layout:fixed}
  .cal th{background:transparent;text-align:center;color:var(--muted);padding:8px}
  .cal td{height:84px;vertical-align:top;border:1px solid var(--line);padding:6px;font-size:12px}
  .cal td .d{font-weight:700;color:#555}
  .cal td.today{background:#fdf6e3}
  .cal td.today .d{color:var(--amber)}
  .cal td.blank{background:#faf9fe}
  .cal .ev{margin-top:3px;font-size:10px;padding:2px 5px;border-radius:5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .overlay{position:fixed;inset:0;background:rgba(20,17,45,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:60}
  .overlay.show{display:flex}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:520px;max-height:92vh;overflow-y:auto}
  .modal-h{padding:16px 20px;border-bottom:1px solid var(--line);font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
  .modal-b{padding:18px 20px}
  .modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  .donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .legend{display:flex;flex-direction:column;gap:8px;font-size:12.5px;flex:1;min-width:150px}
  .legend .li{display:flex;align-items:center;gap:8px}
  .legend .li .sw{width:11px;height:11px;border-radius:3px}
  .legend .li .v{margin-left:auto;font-weight:700}
  .legend .li .p{color:var(--muted);width:44px;text-align:right}

  .bars{display:flex;flex-direction:column;gap:11px}
  .bars .r{display:grid;grid-template-columns:130px 1fr 30px;align-items:center;gap:10px;font-size:12.5px}
  .bars .r .track{height:9px;background:#f0eef8;border-radius:999px;overflow:hidden}
  .bars .r .track>span{display:block;height:100%;border-radius:999px}
  .bars .r .n{text-align:right;font-weight:700}

  .mini{background:#faf9fe;border:1px solid var(--line);border-radius:12px;padding:13px 15px;height:100%}
  .mini h4{font-size:13px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:7px}
  .mini .li{font-size:12.5px;padding:7px 0;border-bottom:1px dashed var(--line)}
  .mini .li:last-child{border-bottom:none}
  .mini .li b{color:var(--ink)}
  .mini .li small{color:var(--muted);display:block;margin-top:1px}

  .dropzone{border:2px dashed #cdc7ea;border-radius:12px;padding:22px;text-align:center;background:#faf9fe;color:var(--muted);cursor:pointer}
  .dropzone:hover{background:#f4f2fc;border-color:var(--violet)}
  .tip{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:14px 16px;font-size:12.5px;color:#166534;line-height:1.9}

  @media(max-width:960px){.two,.three,.info-grid{grid-template-columns:1fr}}
  @media(max-width:820px){
    .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:50;transform:translateX(-100%);transition:.2s}
    .sidebar.open{transform:none}
    .topbar .burger{display:block}
    .hero .clock,.hero-actions{position:static;text-align:left;margin-top:10px;justify-content:flex-start}
  }
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="brand-logo">
      <div class="mark">
        <svg viewBox="0 0 120 70" width="118" height="70">
          <polyline points="14,54 40,38 58,48 82,22 100,30" fill="none" stroke="#6d28d9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M92,18 L104,18 L104,30" fill="none" stroke="#6d28d9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="20" y="48" width="8" height="12" rx="2" fill="#c4b5fd"/>
          <rect x="34" y="42" width="8" height="18" rx="2" fill="#a78bfa"/>
          <rect x="48" y="46" width="8" height="14" rx="2" fill="#c4b5fd"/>
        </svg>
      </div>
      <div class="name" id="brandName">&middot;SIRIKUL&middot;</div>
      <div class="sub" id="brandSub">ACCOUNTING &amp; TAX</div>
    </div>
    <div class="login-hr"></div>
    <div class="login-title">เข้าสู่ระบบ <span id="brandFull">Sirikul Accounting &amp; Tax</span> Client Portal</div>
    <div class="fld"><label>อีเมล / Username *</label><input id="lg_user" placeholder="อีเมลหรือชื่อผู้ใช้"></div>
    <div class="fld"><label>รหัสผ่าน *</label><input id="lg_pass" type="password" placeholder="รหัสผ่าน"></div>
    <div class="fld"><label>ประเภทผู้ใช้งาน</label>
      <select id="lg_role">
        <option value="customer">ลูกค้า</option>
        <option value="owner">เจ้าของระบบ / ผู้ดูแล</option>
      </select></div>
    <label class="login-remember"><input type="checkbox" id="lg_remember"> จำฉันไว้</label>
    <button class="btn-login" id="lg_go">เข้าสู่ระบบ</button>
    <div class="login-err" id="lg_err"></div>
    <div class="login-links"><a id="lg_forgot">ลืมรหัสผ่าน</a><a id="lg_first">เปลี่ยนรหัสผ่านครั้งแรก</a></div>
    <div class="login-demo" id="lg_demo"></div>
    <div class="login-foot" id="brandFoot">&copy; Sirikul Accounting &amp; Tax — Client Portal &amp; Admin Dashboard</div>
  </div>
</div>

<!-- ================= APP ================= -->
<div class="app hidden" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="side-brand">
      <div class="logo">📊</div>
      <div class="t" id="sideBrand">Sirikul Acc.<small id="sideRole">Client Portal</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="left">
        <span class="burger" id="burger">☰</span>
        <h1 id="pageTitle">แดชบอร์ด</h1>
      </div>
      <div class="right">
        <span class="bell" id="bell">🔔<span class="cnt" id="bellCnt">2</span></span>
        <div class="who" id="who"></div>
        <button class="btn-o btn-sm" id="logoutBtn">ออกจากระบบ</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<script>
/* =====================================================================
   Sirikul Accounting & Tax — Client Portal & Admin Dashboard
   ระบบบริหารสำนักงานบัญชี (ไฟล์เดียว, เก็บข้อมูลด้วย localStorage)
   ผู้ใช้ 2 บทบาท: เจ้าของระบบ (owner) / ลูกค้า (customer)
   * แก้ชื่อแบรนด์ได้ที่ค่าคงที่ BRAND ด้านล่าง *
   ===================================================================== */
const BRAND = {
  full: 'Sirikul Accounting & Tax',
  short: 'Sirikul Acc.',
  logoName: '·SIRIKUL·',
  logoSub: 'ACCOUNTING & TAX',
};
const DB_KEY = 'sirikul_app_v1';
/* วันอ้างอิงของระบบสาธิต (ให้ตรงกับสกรีนช็อต 12 มิ.ย. 2569) */
const NOW = new Date('2026-06-12T05:54:00');

/* ---------- helpers ---------- */
const $  = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>Array.from(el.querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = n => Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const money0 = n => Number(n||0).toLocaleString('th-TH');
const THMON = ['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

function daysTo(d){ return Math.round((new Date(d+'T00:00:00') - new Date(NOW.getFullYear()+'-'+String(NOW.getMonth()+1).padStart(2,'0')+'-'+String(NOW.getDate()).padStart(2,'0')+'T00:00:00'))/86400000); }

  if(out<=0) return {t:'ชำระแล้ว',b:'green'};

  return over?{t:'ค้างชำระ',b:'red'}:{t:'ค้างชำระ',b:'red'}; }

/* ---------- modal ---------- */
function modal(title, body, onSave, saveLabel='บันทึก'){
  $('#modal').innerHTML = `<div class="modal-h">${title}</div><div class="modal-b">${body}</div>
    <div class="modal-f"><button class="btn-o" id="mCancel">ยกเลิก</button>${onSave?`<button class="btn-p" id="mSave">${saveLabel}</button>`:''}</div>`;
  $('#overlay').classList.add('show');
  $('#mCancel').onclick = closeModal;
  if(onSave) $('#mSave').onclick = ()=>{ if(onSave()!==false) closeModal(); };
}
function closeModal(){ $('#overlay').classList.remove('show'); }
$('#overlay').onclick = e => { if(e.target.id==='overlay') closeModal(); };
function toast(msg){ const t=document.createElement('div'); t.textContent=msg;
  t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#171533;color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.3)';
  document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }

let session = null;
function loadSession(){ try{ session=JSON.parse(sessionStorage.getItem('sirikul_session')||localStorage.getItem('sirikul_session')); }catch(e){ session=null; } }
function setSession(s,remember){ session=s; const str=JSON.stringify(s);
  if(remember) localStorage.setItem('sirikul_session',str); else sessionStorage.setItem('sirikul_session',str); }
function clearSession(){ session=null; sessionStorage.removeItem('sirikul_session'); localStorage.removeItem('sirikul_session'); }

function doLogin(){
  const u=$('#lg_user').value.trim(), p=$('#lg_pass').value, role=$('#lg_role').value, remember=$('#lg_remember').checked;
  if(role==='owner'){
    if((u===DB.settings.adminUser||u==='admin'||u==='') && (p===DB.settings.adminPass||p==='admin')){
      setSession({role:'owner', name:'เจ้าของระบบ '+BRAND.full}, remember); startApp(); return;
    }
    $('#lg_err').textContent='ชื่อผู้ใช้หรือรหัสผ่านผู้ดูแลไม่ถูกต้อง'; return;
  }
  // customer
  let c = DB.customers.find(x=> x.login.user.toLowerCase()===u.toLowerCase());
  if(!c && u==='') c = DB.customers[0];
  if(c && (p===c.login.pass || p==='')){ setSession({role:'customer', cus:c.id, name:c.contact}, remember); startApp(); return; }
  $('#lg_err').textContent='อีเมลหรือรหัสผ่านลูกค้าไม่ถูกต้อง';
}
function logout(){ clearSession(); location.reload(); }

/* ---------- app boot ---------- */
function startApp(){
  $('#loginScreen').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#sideRole').textContent = session.role==='owner' ? 'Admin Dashboard' : 'Client Portal';
  buildNav(); renderWho();
  const unread = DB.notifications.filter(n=>!n.read).length;
  $('#bellCnt').textContent = unread; $('#bellCnt').style.display = unread?'':'none';
  go(NAVSETS[session.role][0].items[0].page);
}
function renderWho(){
  let sub = session.role==='owner' ? 'Owner' : (cusById(session.cus).name);
  $('#who').innerHTML = `<b>${esc(session.name)}</b><br><small>${esc(sub)}</small>`;
}

function navBadge(page){
  if(session.role==='owner'){
    if(page==='o_review')  return DB.docs.filter(d=>d.status==='pending').length||'';
    if(page==='o_recv')    return DB.receivables.filter(r=>r.amount-r.paid>0).length||'';
  } else {
    const my = session.cus;
    if(page==='c_confirm') return DB.confirms.filter(c=>c.cus===my&&c.status==='pending').length||'';
    if(page==='c_toedit')  return DB.docs.filter(d=>d.cus===my&&d.status==='needfix').length||'';
  }
  return '';
}
function buildNav(){
  $('#nav').innerHTML = NAVSETS[session.role].map(g=>
    `<div class="sec">${g.sec}</div>`+g.items.map(it=>{
      const bd=navBadge(it.page);
      return `<a data-page="${it.page}"><span class="ic">${it.ic}</span><span>${it.label}</span>${bd?`<span class="bdg">${bd}</span>`:''}</a>`;
    }).join('')
  ).join('');
  $$('#nav a').forEach(a=>a.onclick=()=>{ go(a.dataset.page); $('#sidebar').classList.remove('open'); });
}

/* ---------- router ---------- */
let currentPage=null;
function pageTitle(page){
  for(const g of NAVSETS[session.role]) for(const it of g.items) if(it.page===page) return it.label;
  return '';
}
function go(page){
  if(!PAGES[page]) page = NAVSETS[session.role][0].items[0].page;
  currentPage=page;
  $$('#nav a').forEach(a=>a.classList.toggle('active',a.dataset.page===page));
  $('#pageTitle').textContent = pageTitle(page);
  $('#content').scrollTop=0;
  $('#content').innerHTML = PAGES[page]();
  if(PAGES[page].after) PAGES[page].after();
}

/* ---------- small render helpers ---------- */
function tile(lab,num,cls,ic,icCls,hint){
  return `<div class="tile"><div class="ico ${icCls}">${ic}</div><div class="lab">${lab}</div>
    <div class="num ${cls||''}">${num}</div>${hint?`<div class="hint">${hint}</div>`:''}</div>`;
}
function heroBox(tag,title,sub,rightHtml){
  return `<div class="hero"><span class="tag">${tag}</span><h2>${title}</h2>${sub?`<p>${sub}</p>`:''}
    ${rightHtml?`<div class="hero-actions">${rightHtml}</div>`:`<div class="clock"><b>${String(NOW.getHours()).padStart(2,'0')}:${String(NOW.getMinutes()).padStart(2,'0')} น.</b><small>${NOW.getDate()} ${THMONFULL[NOW.getMonth()+1]} ${be(NOW.getFullYear())}</small></div>`}</div>`;
}
function donut(segments,total,centerLabel){
  const R=52,C=2*Math.PI*R; let off=0; const cx=64,cy=64;
  const arcs=segments.filter(s=>s.v>0).map(s=>{ const frac=s.v/total; const len=C*frac;
    const el=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${s.color}" stroke-width="20" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})"/>`;
    off+=len; return el; }).join('');
  return `<svg width="128" height="128" viewBox="0 0 128 128">
    <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#f0eef8" stroke-width="20"/>${arcs}
    <text x="64" y="60" text-anchor="middle" font-size="24" font-weight="800" fill="#1e1b3a">${total}</text>
    <text x="64" y="78" text-anchor="middle" font-size="10" fill="#6b7280">${centerLabel||''}</text></svg>`;
}
function sparkline(vals,w=340,h=110){
  const max=Math.max(1,...vals), min=0, pad=8;
  const pts=vals.map((v,i)=>{ const x=pad+i*(w-2*pad)/(vals.length-1); const y=h-12-(v-min)/(max-min)*(h-30); return [x,y]; });
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L ${pts[pts.length-1][0].toFixed(1)} ${h-12} L ${pts[0][0].toFixed(1)} ${h-12} Z`;
  const dots=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="#7c3aed"/>`).join('');
  const labs=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.'].map((m,i)=>`<text x="${(pad+i*(w-2*pad)/(vals.length-1)).toFixed(1)}" y="${h-1}" text-anchor="middle" font-size="9" fill="#9a97b8">${m}</text>`).join('');
  return `<svg width="100%" viewBox="0 0 ${w} ${h}"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7c3aed" stop-opacity=".28"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#ga)"/><path d="${line}" fill="none" stroke="#7c3aed" stroke-width="2.5"/>${dots}${labs}</svg>`;
}
function taskDueCell(t){
  const d=daysTo(t.due);
  let sub='', col='var(--muted)';
  if(t.status==='done'){ sub=''; }
  else if(d<0){ sub='เกิน '+(-d)+' วัน'; col='var(--red)'; }
  else if(d===0){ sub='อีก 0 วัน'; col='var(--amber)'; }
  else if(d<=7){ sub='อีก '+d+' วัน'; col='var(--amber)'; }
  return `<div style="color:${t.status!=='done'&&d<0?'var(--red)':'inherit'};font-weight:600">${t.due}</div>${sub?`<small style="color:${col}">${sub}</small>`:''}`;
}

function tableCard(head, cols, rowsHtml, sub){

    <div class="tbl-wrap"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
    <tbody>${rowsHtml||`<tr><td colspan="${cols.length}" class="empty">ไม่มีข้อมูล</td></tr>`}</tbody></table></div></div>`;
}

/* ===================== SHARED PAGE HELPERS ===================== */
function badge(o){ return `<span class="b ${o.b}">${o.t}</span>`; }

/* --- generic tasks page with filter chips (งานทั้งหมด style) --- */
let _tctx=null;
function tasksPage(title,sub,list){ _tctx={title,sub,list,filter:'all'}; return _tasksHTML(); }
function _taskFilter(k){ _tctx.filter=k; const el=$('#content'); const html=_tasksHTML();
  // replace only from the stats onward to keep hero — simplest: re-render whole
  el.innerHTML=html; }
function _tasksHTML(){
  const {title,sub,list,filter}=_tctx;
  let rows=list;
  if(filter==='monthly'||filter==='tax'||filter==='closing'||filter==='other') rows=list.filter(t=>t.type===filter);
  else if(filter==='overdue') rows=list.filter(t=>t.status!=='done'&&daysTo(t.due)<0);
  else if(filter==='done') rows=list.filter(t=>t.status==='done');
  else if(filter==='active') rows=list.filter(t=>t.status!=='done');
  const total=list.length;
  const doing=list.filter(t=>t.status==='doing').length;
  const overdue=list.filter(t=>t.status!=='done'&&daysTo(t.due)<0).length;
  const urgent=list.filter(t=>t.priority==='urgent').length;
  const done=list.filter(t=>t.status==='done').length;
  const chip=(k,lab,n)=>`<span class="chip ${filter===k?'on':''}" onclick="_taskFilter('${k}')">${lab}<span class="c">${n}</span></span>`;
  const trows=rows.map(t=>`<tr>
      <td><span class="mono">${t.id}</span></td>
      <td><b>${esc(t.title)}</b><br><small style="color:var(--muted)">${esc(cusName(t.cus))}</small></td>
      <td><span class="b ${TASK_TYPE_COLOR[t.type]}">${TASK_TYPE[t.type]}</span></td>
      <td><span class="b violet">${esc(staffName(t.owner).split(' ')[0])}</span></td>
      <td>${badge(TASK_STATUS[t.status])}</td>
      <td>${t.shared?'<span class="b green">แชร์แล้ว</span>':'<span class="b gray">—</span>'}</td>
      <td>${taskDueCell(t)}</td>
      <td style="white-space:nowrap">
        <button class="btn-ico plain" title="ดู" onclick="viewTask('${t.id}')">👁️</button>
        <button class="btn-ico" title="ปรับสถานะ" onclick="cycleStatus('${t.id}')">🔄</button>
        <button class="btn-ico warn" title="แชร์ให้ลูกค้า" onclick="shareTask('${t.id}')">🔗</button>
      </td></tr>`).join('')||`<tr><td colspan="8" class="empty">ไม่มีงานในหมวดนี้</td></tr>`;
  return heroBox('งานสำนักงาน',title,sub)
   + `<div class="stats">
      ${tile('งานทั้งหมด',total,'','📋','i-violet','กำลังติดตาม')}
      ${tile('กำลังดำเนินการ',doing,'n-blue','⏳','i-blue','อยู่ระหว่างทำ')}
      ${tile('เกินกำหนด',overdue,'n-red','⚠️','i-red','ต้องเร่ง')}
      ${tile('ด่วน / ด่วนมาก',urgent,'n-amber','⚡','i-amber','ความสำคัญสูง')}
      ${tile('เสร็จแล้ว',done,'n-green','✅','i-green',total?Math.round(done/total*100)+'%':'0%')}
     </div>
     <div class="card"><div class="card-h"><div class="toolbar">
        ${chip('all','ทั้งหมด',total)} ${chip('monthly','บัญชีรายเดือน',list.filter(t=>t.type==='monthly').length)}
        ${chip('tax','ภาษี',list.filter(t=>t.type==='tax').length)} ${chip('closing','ปิดงบ',list.filter(t=>t.type==='closing').length)}
        ${chip('other','อื่นๆ',list.filter(t=>t.type==='other').length)}
        ${chip('overdue','เกินกำหนด',overdue)} ${chip('done','เสร็จแล้ว',done)}
        <input class="search" placeholder="🔍 ค้นหางาน / ลูกค้า / รหัส..." oninput="_taskSearch(this.value)">
     </div></div>
     <div class="tbl-wrap"><table><thead><tr><th>รหัส</th><th>ชื่องาน / ลูกค้า</th><th>ประเภท</th><th>ผู้รับผิดชอบ</th><th>สถานะ</th><th>ลิงก์</th><th>กำหนดส่ง</th><th>จัดการ</th></tr></thead>
     <tbody id="taskBody">${trows}</tbody></table></div></div>`;
}
function _taskSearch(q){ q=q.trim().toLowerCase();
  const rows=_tctx.list.filter(t=>!q||(t.id+t.title+cusName(t.cus)+staffName(t.owner)).toLowerCase().includes(q));
  $('#taskBody').innerHTML = rows.map(t=>`<tr>
      <td><span class="mono">${t.id}</span></td>
      <td><b>${esc(t.title)}</b><br><small style="color:var(--muted)">${esc(cusName(t.cus))}</small></td>
      <td><span class="b ${TASK_TYPE_COLOR[t.type]}">${TASK_TYPE[t.type]}</span></td>
      <td><span class="b violet">${esc(staffName(t.owner).split(' ')[0])}</span></td>
      <td>${badge(TASK_STATUS[t.status])}</td>
      <td>${t.shared?'<span class="b green">แชร์แล้ว</span>':'<span class="b gray">—</span>'}</td>
      <td>${taskDueCell(t)}</td>
      <td style="white-space:nowrap"><button class="btn-ico plain" onclick="viewTask('${t.id}')">👁️</button><button class="btn-ico" onclick="cycleStatus('${t.id}')">🔄</button><button class="btn-ico warn" onclick="shareTask('${t.id}')">🔗</button></td></tr>`).join('')||`<tr><td colspan="8" class="empty">ไม่พบงาน</td></tr>`;
}

/* --- generic documents table --- */
function docsTable(title,sub,list,showCus){
  const rows=list.map(d=>`<tr>
    ${showCus?`<td><span class="b gray">${d.cus}</span></td>`:''}

/* --- calendar (June 2026) --- */
function calendarPage(title,sub){
  const y=2026,m=6; // มิถุนายน 2026
  const first=new Date(y,m-1,1).getDay(); // 0=Sun
  const days=new Date(y,m,0).getDate();
  const events={};
  const add=(d,txt,cls)=>{ (events[d]=events[d]||[]).push({txt,cls}); };
  // กำหนดภาษีมาตรฐาน
  add(7,'ภ.ง.ด.1/3/53','ev-blue'); add(15,'ภ.พ.30','ev-violet');
  // จากงานในระบบ
  DB.tasks.forEach(t=>{ const dt=new Date(t.due); if(dt.getMonth()===m-1&&dt.getFullYear()===y){ const over=t.status!=='done'&&daysTo(t.due)<0; add(dt.getDate(), t.title.length>16?t.title.slice(0,16)+'…':t.title, over?'ev-red':'ev-amber'); } });
  const evStyle={'ev-blue':'background:#dbeafe;color:#1d4ed8','ev-violet':'background:#ede9fe;color:#6d28d9','ev-amber':'background:#fef3c7;color:#b45309','ev-red':'background:#fee2e2;color:#b91c1c'};
  let body=''; let day=1;
  for(let week=0;week<6;week++){
    let row='';
    for(let dow=0;dow<7;dow++){
      const idx=week*7+dow;
      if(idx<first||day>days){ row+='<td class="blank"></td>'; }
      else{ const isToday=(day===12);
        const ev=(events[day]||[]).map(e=>`<div class="ev" style="${evStyle[e.cls]}">${esc(e.txt)}</div>`).join('');
        row+=`<td class="${isToday?'today':''}"><div class="d">${day}</div>${ev}</td>`; day++; }
    }
    body+='<tr>'+row+'</tr>';
    if(day>days) break;
  }
  return heroBox('ปฏิทินงานและภาษี',`${title} — ${THMONFULL[m]} ${be(y)}`, sub)
   + `<div class="card"><div class="card-h"><h3>📅 ${THMONFULL[m]} ${be(y)} (${m}/${y})</h3>
        <div class="toolbar"><span class="b blue">ภ.ง.ด.</span><span class="b violet">ภ.พ.30</span><span class="b amber">งานที่ต้องส่ง</span><span class="b red">เกินกำหนด</span></div></div>
      <div class="card-b"><table class="cal"><thead><tr>${['อา','จ','อ','พ','พฤ','ศ','ส'].map(d=>`<th>${d}</th>`).join('')}</tr></thead>
      <tbody>${body}</tbody></table></div></div>`;
}

          </div>

        </div>
        <div>
          <div class="card" style="margin:0"><div class="card-h"><h3>✅ ยืนยันการส่ง</h3></div><div class="card-b">

            <button class="btn-p" style="width:100%;margin-bottom:10px" onclick="submitUpload()">⬆️ อัปโหลดและส่ง</button>

            • หากต้องการแก้ไขหลังส่งแล้ว ไปที่เมนู "เอกสารที่ส่งแล้ว" → ขอแก้ไข</div>
        </div>
      </div></div>`;

function submitUpload(){
  const file=$('#up_file').files[0]; const url=$('#up_url').value.trim();
  if(!$('#up_confirm').checked){ toast('กรุณาติ๊กยืนยันการส่งก่อน'); return; }
  if(!file && !url){ toast('กรุณาแนบไฟล์ หรือใส่ลิงก์'); return; }
  const kind=$('#up_kind').value, mo=$('#up_month').value, yr=$('#up_year').value;
  const name = file?file.name : ($('#up_label').value.trim()||'ลิงก์เอกสาร');
  const at=`${yr}-06-12 ${String(NOW.getHours()).padStart(2,'0')}:${String(NOW.getMinutes()).padStart(2,'0')}`;
  DB.docs.unshift({id:uid('D'), cus:session.cus, file:name, kind, period:mo+'/'+yr, at, status:'pending', note:$('#up_note').value.trim(), link:!!url, url});
  DB.activities.unshift({at, who:myCus().contact, role:'Client', text:`ส่งเอกสาร ${kind} (${mo}/${yr})`});
  save(); toast('ส่งเอกสารให้สำนักงานเรียบร้อยแล้ว ✓'); go('c_mydocs');
}
function doConfirm(id,ok){ const c=DB.confirms.find(x=>x.id===id);
  if(ok){ c.status='confirmed'; toast('ยืนยันข้อมูลเรียบร้อยแล้ว ✓'); save(); go('c_confirm'); }
  else { modal('✏️ ขอแก้ไขข้อมูล',`<div class="fld"><label>ระบุสิ่งที่ต้องการให้แก้ไข</label><textarea id="cfNote" rows="3"></textarea></div>`,
    ()=>{ toast('ส่งคำขอแก้ไขให้สำนักงานแล้ว'); }, 'ส่งคำขอ'); }
}
